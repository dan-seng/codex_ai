<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JARVIS-AI</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="app">
      <header>
        <h1>JARVIS-AI</h1>
        <nav>
          <button id="clearChat" title="Clear Chat">
            <i class="bi bi-trash3"></i>
          </button>
          <a href="https://github.com/dan-seng" title="GitHub" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-github"></i>
          </a>
          <a href="https://linkedin.com/in/danielgidey" title="LinkedIn" target="_blank" rel="noopener noreferrer">
            <i class="bi bi-linkedin"></i>
          </a>
        </nav>
      </header>
  <hr>
      <div class="some">
        <p>What is on you mind today?</p>
      </div>

      <div id="chat_container"></div>
  
      <form id="chat-form">
        <textarea name="prompt" placeholder="Message…" rows="1" cols="1"></textarea>
        <button type="submit">
          <i class="bi bi-send-fill"></i>
        </button>
      </form>
    </div>
  
    <script type="module" src="script.js"></script>
  </body>
  
</html>
